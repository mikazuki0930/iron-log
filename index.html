<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>IRON LOG</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#f5f5f5;font:16px system-ui,sans-serif}main{max-width:600px;margin:auto;padding:24px 18px 110px}h1{color:#d4fa65;letter-spacing:3px;margin:0}h2{font-size:21px}small,.muted{color:#a1a1aa}button,input,select{font:inherit;border:0;border-radius:10px;padding:12px;color:inherit;background:#303238}button{cursor:pointer}button:active{opacity:.7}.accent{background:#d4fa65;color:#15170e;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{text-align:left;padding:20px;background:#22242a;min-height:100px}.tile b{display:block;font-size:22px;margin:8px 0}.card{background:#22242a;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;align-items:center;gap:10px;margin:10px 0}.row input{min-width:0;flex:1;width:100%;font-size:18px}.wide{width:100%;margin-top:10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#34363c;border-radius:8px;padding:8px 12px}nav{position:fixed;bottom:0;left:0;right:0;background:#1a1b20;display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid #333}nav button{background:none;flex:1;max-width:150px;color:#aaa;font-size:13px}nav .active{color:#d4fa65}nav span{display:block;font-size:22px}input[type=date]{color-scheme:dark}svg{width:100%;height:auto} .danger{color:#ff9b9b} .head{display:flex;justify-content:space-between;align-items:center}select{max-width:100%}</style></head><body><main id="app"></main><nav id="nav"></nav><script>
const initial={胸:['チェストプレス','ペックフライ'],背中:['ラットプルダウン','ロープルダウン','アシストチンニング'],肩:['ショルダープレス','サイドレイズ'],二頭筋:['ダンベルカール','ケーブルカール'],三頭筋:['ローププレスダウン','ダンベルフレンチプレス'],脚:['レッグプレス'],腹筋:['腹直筋','右腹斜筋','左腹斜筋'],前腕:['リストカール','リバースリストカール']};const parts=Object.keys(initial),eng=['CHEST','BACK','SHOULDERS','BICEPS','TRICEPS','LEGS','ABS','FOREARMS'];const key='iron-log-v1';let data;try{data=JSON.parse(localStorage.getItem(key))}catch{} data=data||{menu:initial,logs:[],drafts:{}};let tab='home',part='',filter='全て',growthPart='胸',date=today();const app=document.querySelector('#app');function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function persist(){try{localStorage.setItem(key,JSON.stringify(data));return true}catch{alert('保存できません。端末の空き容量やブラウザ設定を確認してください。');return false}}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(label,action,cls='')=>`<button class="${cls}" data-action="${esc(action)}">${label}</button>`;function previous(p){return data.logs.filter(l=>l.part===p&&l.date<date).sort((a,b)=>b.date.localeCompare(a.date))[0]}function draft(){let k=date+'|'+part;return data.drafts[k]??=(Object.fromEntries((data.menu[part]||[]).map(n=>[n,[]])))}function render(){document.querySelector('#nav').innerHTML=[['home','◈','記録'],['history','◷','履歴'],['growth','↗','成長'],['settings','⚙','設定']].map(([t,i,n])=>btn(`<span>${i}</span>${n}`,'tab:'+t,(tab===t||tab==='work'&&t==='home')?'active':'')).join('');let h='<h1>IRON LOG</h1><small>TRAINING LOG</small>';if(tab==='home'){h+='<h2>今日鍛える部位</h2><div class="grid">'+parts.map((p,i)=>{let l=data.logs.filter(x=>x.part===p).sort((a,b)=>b.date.localeCompare(a.date))[0];return btn(`<small style="color:#d4fa65">${eng[i]}</small><b>${p}</b><small>${l?'前回 '+l.date:'記録なし'}</small>`,'part:'+i,'tile')}).join('')+'</div>'}if(tab==='work'){let d=draft(),prev=previous(part);h+=`<div class="head"><h2>${part}トレーニング</h2>${btn('戻る','tab:home')}</div><input type="date" id="date" value="${date}"><p class="muted">前回：${prev?.date||'記録なし'}</p>`;h+=(data.menu[part]||[]).map((n,i)=>{let a=d[n]??=[];return `<section class="card"><h3>${esc(n)}</h3><small>前回の記録</small><div class="chips">${(prev?.sets[n]||[]).map((w,j)=>`<span class="chip">${j+1}：${w} kg</span>`).join('')||'<small>なし</small>'}</div><p>今回の記録</p>${a.map((w,j)=>`<div class="row"><small>SET ${j+1}</small><input type="number" min="0" step="any" inputmode="decimal" placeholder="重量" data-ex="${i}" data-set="${j}" value="${esc(w)}">kg ${btn('×',`del:${i}:${j}`,'danger')}</div>`).join('')}${btn('＋ セットを追加','add:'+i,'accent wide')}</section>`}).join('');h+=btn('トレーニングを保存','save','accent wide')}if(tab==='history'){h+='<h2>履歴</h2>'+`<select id="filter">${['全て',...parts].map(p=>`<option ${p===filter?'selected':''}>${p}</option>`).join('')}</select>`;h+=data.logs.filter(l=>filter==='全て'||l.part===filter).sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<section class="card"><div class="head"><b>${l.date}　${l.part}</b>${btn('編集','edit:'+l.id)}</div>${Object.entries(l.sets).map(([n,a])=>`<p>${esc(n)}<br><small>${a.map((w,i)=>`SET ${i+1}: ${w}kg`).join('　')}</small></p>`).join('')}${btn('削除','remove:'+l.id,'danger')}</section>`).join('')||'<p class="muted">記録はまだありません。</p>'}if(tab==='growth'){h+='<h2>成長</h2><div class="grid" style="margin-bottom:16px">'+parts.map((p,i)=>btn(p,'growthPart:'+i,p===growthPart?'accent':'')).join('')+'</div><h2>'+growthPart+'の成長</h2>';let names=[...new Set([...data.menu[growthPart],...data.logs.filter(l=>l.part===growthPart).flatMap(l=>Object.keys(l.sets))])];h+=names.map(n=>{let assist=n==='アシストチンニング',a=data.logs.filter(l=>l.part===growthPart&&l.sets[n]?.length).sort((a,b)=>a.date.localeCompare(b.date)).map(l=>({date:l.date,w:(assist?Math.min:Math.max)(...l.sets[n])}));let out=`<section class="card"><h3>${esc(n)}</h3><small>${assist?'最小アシスト重量（低いほど高負荷）':'各日の最高重量'}</small>`;if(!a.length)return out+'<p class="muted">記録はまだありません。</p></section>';let max=Math.max(...a.map(x=>x.w),1),top=Math.ceil(max/4)*4,pts=a.map((x,i)=>[44+i*286/Math.max(1,a.length-1),180-x.w/top*145]);out+=`<h2>${a.at(-1).w} kg</h2><svg viewBox="0 0 360 220" style="width:100%" role="img" aria-label="重量推移">${Array.from({length:5},(_,i)=>{let y=180-i*145/4;return `<path d="M44 ${y}H330" stroke="#41434a" stroke-width="0.7"/><text x="38" y="${y+4}" text-anchor="end" fill="#aaa" font-size="10">${top*i/4}</text>`}).join('')}<polyline points="${pts.map(p=>p.join(',')).join(' ')}" stroke="#d4fa65" stroke-width="3" fill="none"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="4" fill="#d4fa65"><title>${a[i].date}: ${a[i].w} kg</title></circle>`).join('')}<text x="44" y="200" fill="#aaa" font-size="11">${a[0].date}</text>${a.length>1?`<text x="330" y="200" text-anchor="end" fill="#aaa" font-size="11">${a.at(-1).date}</text>`:''}</svg><details><summary>重量の履歴</summary>${a.slice().reverse().map(x=>`<p>${x.date}　${x.w} kg</p>`).join('')}</details></section>`;return out}).join('')||'<p class="muted">種目がありません。</p>'}if(tab==='settings'){h+='<h2>固定メニュー設定</h2>'+parts.map((p,i)=>`<section class="card"><b>${p}</b>${data.menu[p].map((n,j)=>`<div class="row"><span style="flex:1">${esc(n)}</span>${btn('↑',`up:${i}:${j}`)}${btn('×',`menuDel:${i}:${j}`,'danger')}</div>`).join('')}${btn('＋ 種目を追加','menuAdd:'+i,'wide')}</section>`).join('')+`<h2>バックアップ</h2>${btn('データを書き出す','export','wide')}${btn('データを復元する','import','wide')}<input hidden type="file" id="file" accept="application/json"><p class="muted">データはこのブラウザ内に保存されます。定期的にバックアップしてください。</p>`}app.innerHTML=h}
app.addEventListener('input',e=>{if(e.target.dataset.ex!==undefined){let n=data.menu[part][+e.target.dataset.ex];draft()[n][+e.target.dataset.set]=e.target.value;persist()}});app.addEventListener('change',async e=>{if(e.target.id==='date'){date=e.target.value||today();render()}if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='file'){try{let x=JSON.parse(await e.target.files[0].text());if(!x.menu||!Array.isArray(x.logs)||!x.drafts||!parts.every(p=>Array.isArray(x.menu[p])&&x.menu[p].every(n=>typeof n==='string'))||!x.logs.every(l=>parts.includes(l.part)&&typeof l.date==='string'&&l.sets&&Object.values(l.sets).every(a=>Array.isArray(a)&&a.every(w=>typeof w==='number'&&Number.isFinite(w)&&w>=0))))throw Error();if(confirm('現在のデータを置き換えますか？')){data=x;persist();render()}}catch{alert('バックアップを読み込めませんでした。')}}});document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let [a,i,j]=b.dataset.action.split(':');if(a==='tab'){tab=i;render();return}if(a==='growthPart'){growthPart=parts[+i];render();return}if(a==='part'){part=parts[+i];date=today();tab='work';let l=data.logs.find(l=>l.part===part&&l.date===date);if(l&&!data.drafts[date+'|'+part])data.drafts[date+'|'+part]=structuredClone(l.sets)}if(a==='add'||a==='del'){let n=data.menu[part][+i],s=draft()[n]??=[];if(a==='add')s.push(s.at(-1)??'');else s.splice(+j,1);persist()}if(a==='save'){let s=draft(),out={};for(let n of data.menu[part]){let v=s[n]||[];if(v.some(w=>String(w).trim()===''||!Number.isFinite(Number(w))||Number(w)<0)){alert('重量を正しく入力してください');return}if(v.length)out[n]=v.map(Number)}if(!Object.keys(out).length){alert('セットを追加してください');return}let old=data.logs.find(l=>l.date===date&&l.part===part);data.logs=data.logs.filter(l=>!(l.date===date&&l.part===part));data.logs.push({id:old?.id||String(Date.now()),date,part,sets:out});delete data.drafts[date+'|'+part];if(persist()){tab='home';alert('保存しました')}}if(a==='edit'){let l=data.logs.find(l=>l.id===i);part=l.part;date=l.date;data.drafts[date+'|'+part]=structuredClone(l.sets);tab='work'}if(a==='remove'&&confirm('この記録を削除しますか？')){data.logs=data.logs.filter(l=>l.id!==i);persist()}if(a==='menuAdd'){let n=prompt('種目名');if(n?.trim()&&!data.menu[parts[+i]].includes(n.trim())){data.menu[parts[+i]].push(n.trim());persist()}}if(a==='menuDel'&&confirm('固定メニューから削除しますか？ 過去の履歴は残ります。')){data.menu[parts[+i]].splice(+j,1);persist()}if(a==='up'&&+j>0){let s=data.menu[parts[+i]];[s[+j-1],s[+j]]=[s[+j],s[+j-1]];persist()}if(a==='export'){let u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));let el=document.createElement('a');el.href=u;el.download='iron-log-'+today()+'.json';el.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}if(a==='import'){document.querySelector('#file').click();return}render()});render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
